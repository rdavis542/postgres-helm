apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "postgres.name" . }}-config
  labels:
    {{- include "postgres.labels" . | nindent 4 }}
data:
  pg_hba.conf: |
    # TYPE  DATABASE        USER            ADDRESS                 METHOD
    {{- range .Values.pgHbaLines }}
    {{ . }}
    {{- end }}

  postgresql.conf: |
    data_directory = '/data/pgdata'
    hba_file = '/config/pg_hba.conf'
    ident_file = '/config/pg_ident.conf'
    {{- range $key, $value := .Values.postgresqlConf }}
    {{ $key }} = {{ $value }}
    {{- end }}
