apiVersion: v1
kind: Secret
metadata:
  name: {{ include "postgres.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "postgres.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ required "secrets.password is required (set via values-secret.yaml or ArgoCD values)" .Values.secrets.password | quote }}
