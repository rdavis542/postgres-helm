apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgres
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/rdavis542/postgres-helm.git
    targetRevision: main
    path: .
    helm:
      valueFiles:
        - values.yaml
      # secrets.password is deliberately NOT set here. Provide it via one of:
      #   - a second, untracked values file merged in a wrapping Application/ApplicationSet
      #   - spec.source.helm.valuesObject on a private Application definition (not committed)
      #   - an External Secrets / Sealed Secrets operator populating the Secret out-of-band
      #     (in which case remove templates/secret.yaml and reference the external Secret name)

  destination:
    server: https://kubernetes.default.svc
    namespace: postgres

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
